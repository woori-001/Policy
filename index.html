<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>상부정책 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bd:#3B7DD8;--ba:#7BAEE8;--bl:#F0F5FD;
  --bg:#FFFFFF;--sf:#fff;--sf2:#FAFAFA;--gutter:#E9ECF1;
  --br:#E4E7EC;--t1:#111827;--t2:#4B5563;--t3:#9CA3AF;
  --gn:#16A34A;--or:#D97706;--rd:#DC2626;
  --gold:#9a6510;--gold-bg:#FFF8E4;--gold-line:#F3DCA0;
  --teal:#2E6BB8;--teal-bg:#EEF4FC;--teal-line:#CFE0F5;
  --num:'Inter','Pretendard',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Inter',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;font-size:13px}
button{font-family:inherit}
.hidden{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.1s;white-space:nowrap;letter-spacing:-.1px}
.btn-p{background:var(--bd);color:#fff}.btn-p:hover{background:#1A50C5}
.btn-o{background:#fff;color:var(--t2);border:1px solid var(--br)}.btn-o:hover{background:#F9FAFB;border-color:#D1D5DB;color:var(--t1)}
.btn-d{background:#fff;color:var(--rd);border:1px solid #FECACA}.btn-d:hover{background:#FEF2F2}
.sm{padding:5px 9px;font-size:11.5px}
.fi{padding:6px 10px;border:1px solid var(--br);border-radius:6px;font-size:12px;font-family:inherit;color:var(--t1);background:#fff;outline:none;transition:.1s}
.fi:focus{border-color:var(--bd);box-shadow:0 0 0 3px rgba(37,99,235,.08)}

/* ── LOGIN ── */
#login{position:fixed;inset:0;display:grid;place-items:center;background:#EEF1F5;z-index:100}
.login-card{width:370px;max-width:92vw;background:#fff;border:1px solid var(--br);border-radius:16px;box-shadow:0 12px 40px rgba(16,24,40,.1);padding:30px 28px;text-align:center}
.login-card .logo{width:46px;height:46px;border-radius:13px;margin:0 auto 14px;background:linear-gradient(135deg,var(--bd),#7c3aed)}
.login-card h1{font-size:19px;margin-bottom:5px;letter-spacing:-.02em}
.login-card p{color:var(--t3);font-size:12.5px;margin-bottom:22px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:1px solid var(--br);border-radius:10px;background:#fff;color:var(--t1);font-weight:700;font-size:14px;cursor:pointer}
.gbtn:hover{border-color:#c9ced6}
.gbtn svg{width:18px;height:18px}
.who{margin-top:14px;font-size:12px;color:var(--t3)}
.who select{font-family:inherit;font-size:12px;padding:4px 6px;border-radius:7px;border:1px solid var(--br);background:#fff;color:var(--t1)}
.login-note{margin-top:14px;font-size:11px;color:var(--t3);line-height:1.6}

/* ── SHELL ── */
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:224px;min-width:224px;background:#fff;border-right:1px solid var(--br);display:flex;flex-direction:column}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.sb-head .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--bd),#7c3aed);flex-shrink:0}
.sb-name{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.sb-sub{font-size:10.5px;color:var(--t3);margin-top:1px;font-weight:400}
.sb-scroll{flex:1;overflow-y:auto;padding:12px 0 6px}
.sb-sec-hd{display:flex;align-items:center;padding:10px 14px 4px}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--t3);text-transform:uppercase}
.sb-sec-hd .edit-link{margin-left:auto;font-size:10.5px;color:var(--bd);cursor:pointer;font-weight:600;user-select:none}
.sb-sec-hd .edit-link:hover{text-decoration:underline}
.nav{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);border-radius:7px;margin:1px 8px;user-select:none}
.nav:hover{color:var(--t1);background:#F3F4F6}
.nav.on{color:var(--bd);background:#EBF2FA;font-weight:600}
.nav .ico{width:15px;height:15px;flex-shrink:0;opacity:.6;display:grid;place-items:center}
.nav.on .ico{opacity:1}
.nav .cnt{margin-left:auto;font-size:10px;background:#EEF1F5;color:var(--t3);border-radius:5px;padding:1px 6px;font-weight:700}
.nav.on .cnt{background:#D9E6F8;color:var(--bd)}
.nav .tag{margin-left:auto;font-size:10px;color:var(--t3)}
.nav.dim{color:var(--t3);cursor:default}.nav.dim:hover{background:transparent}
.nav-edit{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-edit button{border:none;background:#F3F4F6;color:var(--t2);width:20px;height:20px;border-radius:5px;cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center}
.nav-edit button:hover{background:#E5E7EB;color:var(--t1)}
.nav-edit button.rm:hover{background:#FEE2E2;color:var(--rd)}
/* collapsible groups (대분류 → 중분류) */
.gp{margin:1px 4px}
.gt{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;font-size:13px;font-weight:600;color:var(--t2);border-radius:7px;cursor:pointer;user-select:none}
.gt:hover{background:#F3F4F6;color:var(--t1)}
.gt .fi-ico{width:17px;height:17px;flex:none;color:#7ba0dc;display:grid;place-items:center}
.gp.open .gt .fi-ico{color:#0d5bd4}
.gt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt .arw{color:#c3c6cc;font-size:9px;transition:transform .15s;flex:none}
.gp.open .gt{color:var(--t1)}
.gp.open .gt .arw{transform:rotate(90deg)}
.subs{display:none;padding:1px 0 6px}
.gp.open .subs{display:block}
.subnav{width:calc(100% - 8px);display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:6px 10px 6px 34px;font-size:12.5px;color:var(--t2);border-radius:7px;cursor:pointer;margin:1px 4px;user-select:none}
.subnav:hover{background:#F3F4F6;color:var(--t1)}
.subnav.on{color:var(--bd);font-weight:700;background:#EBF2FA}
.subnav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subnav .cnt{font-size:10px;color:var(--t3)}
.subnav.on .cnt{color:var(--bd)}
.addsub{padding:5px 10px 5px 34px;font-size:11.5px;color:var(--bd);cursor:pointer;font-weight:600;margin:0 4px}
.addsub:hover{text-decoration:underline}
.add-tel{margin:6px 10px 2px;padding:8px;border:1px dashed var(--br);border-radius:8px;color:var(--t2);font-size:12px;font-weight:600;text-align:center;cursor:pointer;background:#fff}
.add-tel:hover{border-color:var(--bd);color:var(--bd);background:var(--bl)}
.sb-foot{padding:12px;border-top:1px solid var(--br)}
.s-user{display:flex;align-items:center;gap:9px;font-size:12.5px}
.s-user .av{width:30px;height:30px;border-radius:50%;background:#E5EAF2;display:grid;place-items:center;font-weight:800;color:var(--bd);font-size:12px}
.s-user .role{color:var(--t3);font-size:11px}
.s-actions{display:flex;gap:6px;margin-top:10px}
.s-actions button{flex:1;background:#fff;color:var(--t2);border:1px solid var(--br);border-radius:7px;padding:6px;font-size:11.5px;font-weight:600;cursor:pointer}
.s-actions button:hover{background:#F9FAFB;color:var(--t1)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--br);padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between}
.tb-l{display:flex;align-items:baseline;gap:10px}
.tb-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.tb-badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.tb-badge.cmp{background:var(--bl);color:var(--bd)}
.tb-badge.one{background:#F3F4F6;color:var(--t3)}
.tb-r{display:flex;gap:7px;align-items:center}
.save-status{font-size:11px;color:var(--gn);font-weight:600;opacity:0;transition:.2s;margin-right:4px}
.content{flex:1;overflow-y:auto;padding:18px 22px 60px}

/* KPI bar */
.kpi{background:#fff;border:1px solid var(--br);border-radius:10px;padding:13px 18px;display:flex;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:2px}
.kpi-item{display:flex;flex-direction:column;gap:2px;padding:0 18px}
.kpi-item:first-child{padding-left:0}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.3px;text-transform:uppercase}
.kpi-val{font-size:20px;font-weight:800;font-family:var(--num);letter-spacing:-.5px}
.kpi-val.small{font-size:15px}
.kpi-div{width:1px;height:32px;background:var(--br)}
.kpi-sel{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:18px;border-left:1px solid var(--br)}
.kpi-sel label{font-size:11px;color:var(--t3);font-weight:600}
.kpi-sel input[type=month]{padding:5px 9px;border:1px solid var(--br);border-radius:6px;font-size:11.5px;font-family:inherit;outline:none}
.kpi-sel input[type=month]:focus{border-color:var(--bd)}

/* add bar */
.add-bar{background:#fff;border:1px solid var(--br);border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.add-bar label{font-size:11.5px;font-weight:700;color:var(--t2)}
.add-bar .hint{font-size:11px;color:var(--t3);margin-left:auto}
.add-bar .spacer{flex:1}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:9px 4px 12px;font-size:11.5px;color:var(--t3)}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:13px;border-radius:4px;border:1px solid transparent;display:inline-block}
.sw.gold{background:var(--gold-bg);border-color:var(--gold-line)}
.sw.teal{background:var(--teal-bg);border-color:var(--teal-line)}

/* table */
.tbl-wrap{overflow-x:auto;width:max-content;max-width:100%;border-radius:10px;border:1px solid #DDE1E7;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06)}
table{border-collapse:separate;border-spacing:0;width:100%}
#tbl{table-layout:fixed}
th,td{white-space:nowrap}
thead th{background:#FAFBFC;color:var(--t2);padding:9px 11px;font-size:11px;font-weight:700;position:sticky;top:0;z-index:10;border-bottom:1px solid #E9EBEF;text-align:right}
thead th.vh{text-align:center;color:#fff;background:var(--bd);border-left:1px solid rgba(255,255,255,.22);position:relative;font-weight:700;font-size:12px}
thead th.lh{font-size:13px;color:var(--t1)}
td.grpl{cursor:pointer}
.grp-fold{color:var(--bd);margin-right:8px;display:inline-flex;vertical-align:-3px}
.grp-fold svg{width:15px;height:15px}
.grp-edit{border:none;background:#EEF2F7;color:var(--t2);border-radius:5px;font-size:11px;padding:1px 7px;margin-left:10px;cursor:pointer;vertical-align:1px}
.grp-edit:hover{background:#E1E7EF;color:var(--t1)}
.grp-dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.grp-emo{margin-right:7px}
.grp-ic{color:var(--bd);margin-right:7px;display:inline-flex;vertical-align:-2px}
.gic{width:15px;height:15px}
thead tr.mh th{font-weight:600;font-size:10.5px;border-left:none;color:var(--t2)}
thead tr.mh th.vstart{border-left:1px solid #E7EAEF}
.c-item{text-align:left!important;position:sticky;left:0;width:150px;min-width:150px;max-width:150px;border-right:1px solid #E6E9EE;background:#fff;font-weight:600;color:#374151;z-index:6}
thead .c-item{z-index:12}
.grpl{position:sticky;left:0;z-index:6;text-align:left!important;font-weight:700;color:var(--t2);font-size:11.5px;letter-spacing:.01em}
tbody td{padding:7px 11px;border-bottom:1px solid #EBEDF1;font-size:12px;background:#fff;text-align:right}
tbody tr:hover td{background:#F7F9FC}
tbody tr:hover .c-item{background:#F0F2F6}
.grp td{background:#FAFBFC!important;border-top:1px solid #EDEFF2;border-bottom:1px solid #EDEFF2;padding:8px 11px}

td.pv{color:#6B7078;font-size:11px;font-family:var(--num)}
td.sep{color:var(--t1);font-family:var(--num)}
td.sep.vstart,td.pv.vstart{border-left:1px solid #E7EAEF}
td.sep{border-left:none}
td.incl{color:var(--t1);font-weight:700;font-family:var(--num);border-left:none}
td.dash{color:#D1D5DB}
#tbl.can-edit td.sep,#tbl.can-edit td.pv{cursor:pointer}
#tbl.can-edit td.sep:hover,#tbl.can-edit td.pv:hover{outline:1.5px solid var(--bd);outline-offset:-1px;background:#EBF0FA}
.tbl-note{font-size:11.5px;color:var(--t2);background:#F9FAFB;border:1px solid var(--br);border-radius:7px;padding:7px 11px;margin-bottom:10px}
td.cell-editing{padding:0!important}
td.cell-editing input{width:100%;height:100%;border:none;background:#EBF0FA;font-family:var(--num);font-size:12px;text-align:right;padding:6px 10px;outline:1.5px solid var(--bd);outline-offset:-1px}
td.top-sep{background:var(--teal-bg)!important;color:var(--teal)!important;font-weight:800}
td.top-inc{background:var(--gold-bg)!important;color:var(--gold)!important;font-weight:800}
tbody tr:hover td.top-sep{background:#E4EEFB!important}
tbody tr:hover td.top-inc{background:#FCF3D6!important}

th.vh .rm-v{position:absolute;top:3px;right:4px;background:#EF4444;border:none;border-radius:4px;color:#fff;font-size:10px;width:15px;height:15px;cursor:pointer;line-height:15px;padding:0;display:none}
#tbl.can-edit th.vh:hover .rm-v{display:block}
td.rn{cursor:pointer}
.rowctl{display:none;gap:2px;margin-right:6px}
.editing-rows .rowctl{display:inline-flex;vertical-align:middle}
.rowctl button{border:none;background:#EAEEF3;color:var(--t2);width:18px;height:18px;border-radius:4px;cursor:pointer;font-size:10px;line-height:1;padding:0}
.rowctl button:hover{background:#DCE2EA;color:var(--t1)}
.rowctl button.rm:hover{background:#FEE2E2;color:var(--rd)}

.c-best{position:sticky;right:0;background:#fff;border-left:1px solid #E7EAEF;min-width:100px;text-align:left!important;white-space:normal;line-height:1.7;box-shadow:-5px 0 9px -4px rgba(16,24,40,.05)}
tbody tr:hover .c-best{background:#F7F9FC}
thead .c-best{z-index:12}
.best-chip{display:inline-block;background:#E8F1FC;color:#1E4E86;border:1px solid #BBD9F5;border-radius:999px;padding:2px 9px;font-weight:800;font-size:11.5px;margin:0 3px 3px 0}
.best-multi{font-size:10.5px;color:var(--t3);margin-top:2px}

/* image view */
.card{background:#fff;border:1px solid var(--br);border-radius:10px;overflow:hidden}
.imgwrap{padding:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
@media(max-width:900px){.imgwrap{grid-template-columns:1fr}}
.imgbox{border:1.5px dashed var(--br);border-radius:10px;background:#FAFBFC;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:8px;text-align:center;padding:20px}
.imgbox .fn{font-weight:700;color:var(--t1)}
.imgbox svg{width:38px;height:38px;opacity:.5}
.mini-note{font-size:11.5px;color:#1E4E86;background:#EAF3FE;border:1px solid #BBD9F5;padding:8px 12px;border-radius:8px;line-height:1.6;margin:0 18px 16px}
.seg-tbl{width:100%}.seg-tbl th{background:transparent;position:static;border:none;text-align:right;color:var(--t3);padding:6px 8px}
.seg-tbl th:first-child{text-align:left}
.seg-tbl td{border-bottom:1px solid #F3F4F6;text-align:right;padding:8px}
.seg-tbl td:first-child{text-align:left;font-weight:700}

/* modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center}
.mo.open{display:flex}
.md{background:#fff;border-radius:12px;box-shadow:0 10px 36px rgba(0,0,0,.16);border:1px solid var(--br);width:440px;max-width:92vw;max-height:86vh;overflow-y:auto}
.m-hd{padding:15px 18px;border-bottom:1px solid var(--br);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.m-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3)}.m-x:hover{color:var(--t1)}
.m-body{padding:16px 18px}
.m-ft{padding:12px 18px;border-top:1px solid var(--br);display:flex;justify-content:flex-end;gap:7px}
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:700;color:var(--t2);display:block;margin-bottom:4px}
.fg input,.fg select{width:100%;padding:8px 10px;border:1px solid var(--br);border-radius:7px;font:inherit;font-size:13px;background:#fff;color:var(--t1);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--bd)}
.allow-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F6}
.allow-row .em{flex:1;font-size:12.5px}
.allow-row .em small{color:var(--t3)}
.allow-row .rl{font-size:11px;color:var(--t2);background:#F3F4F6;border-radius:6px;padding:2px 8px}
.allow-row .del{border:none;background:none;color:var(--rd);cursor:pointer;font-size:11.5px;font-weight:700}
.allow-row .nm{border:1px solid var(--br);border-radius:5px;padding:2px 6px;font-size:12px;width:88px;margin-top:3px}
.allow-row .rl-tog{cursor:pointer;border:1px solid var(--br);font-weight:600}
.allow-row .rl-tog:hover{background:#E8EEFF;color:var(--bd)}
.add-row2{display:flex;gap:8px;margin-top:14px}
.add-row2 input{flex:1;padding:9px 11px;border:1px solid var(--br);border-radius:8px;font:inherit;background:#fff;outline:none}
.mo-hint{font-size:11px;color:var(--t3);margin-top:8px;line-height:1.6}

@media print{.sb,.topbar,.add-bar,.kpi-sel,.legend,.rm-v{display:none!important}.content{padding:0!important;overflow:visible!important}.app{height:auto!important;display:block}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}

/* index-style layout */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tophdr{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid var(--br)}
.th-left{display:flex;align-items:center;gap:10px}
.th-app{font-weight:800;font-size:15px;letter-spacing:-.3px}
.th-right{display:flex;align-items:center;gap:9px}
.th-div{width:1px;height:22px;background:var(--br)}
.th-mlabel{font-size:11.5px;color:var(--t3);font-weight:600}
.th-month{padding:6px 9px;border:1px solid var(--br);border-radius:7px;font:inherit;font-size:12px;outline:none;color:var(--t1)}
.th-user{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:0 2px}
.th-user .av{width:28px;height:28px;border-radius:50%;background:#E5EAF2;display:grid;place-items:center;font-weight:800;color:var(--bd);font-size:12px}
.th-role{color:var(--t3);font-size:11px}
.appbody{flex:1;display:flex;overflow:hidden}
.sb{width:224px;min-width:224px;background:#fff;border-right:1px solid var(--br);display:flex;flex-direction:column;overflow:hidden}
.mainpane{flex:1;overflow:auto;padding:18px 22px 60px;background:var(--bg)}
.page-title h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:14px}
/* memo (per-vendor sticky note) */
.memocell{padding:6px 8px!important;vertical-align:top;background:#fff;text-align:left!important}
.memo{display:flex;gap:6px;align-items:flex-start;background:#EAF3FE;border:1px solid #BBD9F5;border-radius:6px;padding:6px 9px;font-size:11.5px;color:#1E4E86;line-height:1.5;text-align:left;font-weight:500}
.memo-ic{width:13px;height:13px;flex:none;margin-top:1px}
tr.memorow td{border-bottom:1px solid var(--br)}

   {id:"sky",name:"SKY",type:"table",vendors:["도매가이드","플라츠","타임","백메가"],data:mkSKY(),note:"ALL 번들 베이직 기준 · 원스톱 추가정책 일반번들 5만, 30%번들 1.5만"},
 ]},

   {id:"kt", name:"KT유선",  type:"table",vendors:["KT본사"],data:mkKT(),note:"VAT 별도 기준 · 정책 담당자 외 수정 엄금"},

 ]},

 ]},
 {id:"c_lg",name:"LG",subs:[

const ALLOW=[
  {em:"w33439067@gmail.com",name:"담민",role:"관리자"},

const USERS={admin:{name:"담민",role:"관리자",av:"담",isAdmin:true},mgr:{name:"이수진",role:"담당자",av:"이",isAdmin:false},deny:{denied:true}};

let state={user:null,tid:"sky",month:"2026-08",menuEdit:false,rowEdit:false,dataEdit:false,snap:null,open:{c_sky:true}};
let _uid=100;
CARRIERS.forEach(c=>c.subs.forEach(s=>{ if(Array.isArray(s.vendors)) s.vendors=s.vendors.map(v=>typeof v==="string"?{name:v,memo:""}:v); if(!s.labels) s.labels=["상품"]; if(s.data) s.data.forEach(g=>g.rows.forEach(r=>{ if(!r.ext) r.ext=[]; })); }));
(function(){ /* 데모용 과거 스냅샷 (SKY) */
  const sky=CARRIERS[0].subs[0];
  const cloneD=d=>d.map(g=>({g:g.g,rows:g.rows.map(r=>({n:r.n,ext:(r.ext||[]).slice(),c:r.c.map(c=>c?c.slice():null)}))}));
  const cloneV=v=>v.map(x=>({name:x.name,memo:""}));
  const mk=(ts,delta)=>{ const d=cloneD(sky.data); d.forEach(g=>g.rows.forEach(r=>r.c.forEach(c=>{ if(c&&c[1]>=300000) c[1]-=delta; }))); return {ts,vendors:cloneV(sky.vendors),data:d}; };
  sky.snaps=[ mk("2026-08-01 00:00",20000), mk("2026-08-05 09:00",10000) ];
  const kt=CARRIERS[1].subs[0];
  const mkK=(ts,delta)=>{ const d=cloneD(kt.data); d.forEach(g=>g.rows.forEach(r=>r.c.forEach(c=>{ if(c&&c[1]>=200000) c[1]-=delta; }))); return {ts,vendors:cloneV(kt.vendors),data:d}; };
  kt.snaps=[ mkK("2026-07-25 14:00",15000) ];
})();

/* ===================== HELPERS ===================== */

const incl=c=>c==null?null:(c[0]||0)+(c[1]||0);
const tget=()=>{ for(const c of CARRIERS) for(const s of c.subs) if(s.id===state.tid) return s; return null; };
const carrierOf=id=>CARRIERS.find(c=>c.subs.some(s=>s.id===id));

const isMulti=t=>t.type==="table"&&t.vendors.length>=2;
function curView(){ const t=tget(); if(state.snap==null||!t.snaps||!t.snaps[state.snap]) return {vendors:t.vendors,data:t.data,ro:false}; const s=t.snaps[state.snap]; return {vendors:s.vendors,data:s.data,ro:true}; }
function populateSnaps(t){ const sel=$("snapSel"); if(!sel)return;
  let o='<option value="cur">현재 (최신)</option>';
  if(t.snaps) for(let i=t.snaps.length-1;i>=0;i--) o+=`<option value="${i}">${t.snaps[i].ts}</option>`;

  sel.style.color=state.snap==null?"":"#8A5A00";

function folderSVG(open){

$("menuEditLink").onclick=()=>{

function buildNav(){
  const el=$("navList"); el.innerHTML="";
  CARRIERS.forEach((c,ci)=>{
    const open=!!state.open[c.id];
    const gp=document.createElement("div"); gp.className="gp"+(open?" open":"");

    if(state.menuEdit) ctrl=`<span class="nav-edit">
      <button data-a="cup" ${ci===0?'disabled style="opacity:.3"':''}>↑</button>
      <button data-a="cdown" ${ci===CARRIERS.length-1?'disabled style="opacity:.3"':''}>↓</button>
      <button data-a="crename" title="이름변경">✎</button>
      <button data-a="caddsub" title="중분류 추가">＋</button>
      <button class="rm" data-a="cdel" title="삭제">✕</button></span>`;
    const gt=document.createElement("button"); gt.className="gt";
    gt.innerHTML=`<span class="fi-ico">${folderSVG(open)}</span><span class="nm">${c.name}</span>${ctrl}`;
    gt.onclick=e=>{ const b=e.target.closest("button[data-a]"); if(b){e.stopPropagation(); carrierAct(b.dataset.a,ci); return;} onGroup(c); };
    gp.appendChild(gt);
    const subs=document.createElement("div"); subs.className="subs";

function subAct(a,ci,si){

const ICON_OPTS=[["","없음 (파란 도형)"],["inet","인터넷 / 와이파이"],["tv","TV"],["bundle","번들 / 결합"],["mobile","모바일"],["gift","상품권 / 사은품"],["tag","태그"],["star","별"],["doc","문서"]];
function renderTable(){
  const t=tget(), cv=curView(), V=cv.vendors, D=cv.data, multi=(t.type==="table"&&V.length>=2);
  const L=t.labels, nL=L.length;
  const lw=i=>(i===0?150:96);
  const loff=[]; { let x=0; for(let i=0;i<nL;i++){ loff.push(x); x+=lw(i); } }
  const leftW=loff[nL-1]+lw(nL-1);
  const wPv=58,wSep=88,wInc=88,wBest=112;
  let cg=""; for(let i=0;i<nL;i++) cg+=`<col style="width:${lw(i)}px">`;
  V.forEach(()=>cg+=`<col style="width:${wPv}px"><col style="width:${wSep}px"><col style="width:${wInc}px">`);
  if(multi) cg+=`<col style="width:${wBest}px">`;
  const total=leftW+V.length*(wPv+wSep+wInc)+(multi?wBest:0);
  const cols=nL+V.length*3+(multi?1:0);
  let h=`<table id="tbl" style="width:${total}px"><colgroup>${cg}</colgroup><thead><tr class="vh">`;
  L.forEach((lab,i)=>{ const del=state.dataEdit&&i>0; h+=`<th class="lh ${i===0?'c-item':'c-lbl'}" data-li="${i}" rowspan="2" style="left:${loff[i]}px">${lab}${del?`<button class="rm-l" data-i="${i}" title="구분 삭제">×</button>`:''}</th>`; });
  V.forEach((v,vi)=>{ h+=`<th class="vh" data-v="${vi}" colspan="3"><span class="vname">${v.name}</span><button class="rm-v" data-v="${vi}" title="상부 삭제">×</button></th>`; });
  if(multi) h+=`<th class="c-best" rowspan="2">최고 상부<br><span style="font-weight:600;font-size:10px;opacity:.8">(포함 기준)</span></th>`;
  h+=`</tr><tr class="mh">`;
  V.forEach((v,i)=>{ const m=i%2?" mv1":""; h+=`<th class="${i===0?'vstart':''}${m}">상품권</th><th class="${m.trim()}">상품권 별도</th><th class="${m.trim()}">상품권 포함</th>`; });
  h+=`</tr></thead><tbody>`;
  if(V.some(v=>v.memo)){
    h+=`<tr class="memorow">`;
    for(let i=0;i<nL;i++) h+=`<td class="${i===0?'c-item':'c-lbl'}" style="left:${loff[i]}px"></td>`;
    const memoIc=`<svg class="memo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>`;
    V.forEach((v,i)=>{ h+=`<td class="memocell ${i===0?'vstart':''}${i%2?' v1':''}" colspan="3">${v.memo?`<div class="memo">${memoIc}<span>${v.memo.replace(/</g,'&lt;')}</span></div>`:''}</td>`; });
    if(multi) h+=`<td class="c-best"></td>`;
    h+=`</tr>`;
  }
  D.forEach((grp,gi)=>{
    const collapsed=!!grp.collapsed;
    const gmk=`<span class="grp-fold">${folderSVG(!collapsed)}</span>`;
    const geb=state.dataEdit?`<button class="grp-edit" data-gi="${gi}" title="이름 변경">✎</button>`:"";
    h+=`<tr class="grp${collapsed?' collapsed':''}"><td class="grpl" data-gi="${gi}" colspan="${cols}">${gmk}${grp.g}${geb}</td></tr>`;
    if(!collapsed){
    const lspan=[];
    for(let li=0;li<nL-1;li++){ const col=[], rows=grp.rows; let ri=0;
      while(ri<rows.length){ const val=(rows[ri].ext&&rows[ri].ext[li])||"";
        if(val===""){ col[ri]=1; ri++; continue; }
        let j=ri+1; while(j<rows.length && ((rows[j].ext&&rows[j].ext[li])||"")===val) j++;
        col[ri]=j-ri; for(let k=ri+1;k<j;k++) col[k]=0; ri=j; }
      lspan.push(col); }
    grp.rows.forEach((row,ri)=>{
      const seps=row.c.map(c=>c?c[1]:null), incs=row.c.map(incl);
      const mxS=Math.max(...seps.filter(x=>x!=null),-Infinity), mxI=Math.max(...incs.filter(x=>x!=null),-Infinity);
      const upDis=(gi===0&&ri===0), downDis=(gi===t.data.length-1&&ri===grp.rows.length-1);
      const ctl=state.rowEdit?`<span class="rowctl"><button data-a="up" ${upDis?'disabled style="opacity:.3"':''} title="위로">↑</button><button data-a="down" ${downDis?'disabled style="opacity:.3"':''} title="아래로">↓</button><button class="rm" data-a="del" title="삭제">✕</button></span>`:"";
      h+=`<tr><td class="c-item rn" data-g="${gi}" data-r="${ri}" style="left:${loff[0]}px">${ctl}<span class="rnm">${row.n}</span></td>`;
      for(let i=1;i<nL;i++){ const sp=lspan[i-1][ri]; if(sp===0) continue; const ev=(row.ext&&row.ext[i-1])||""; h+=`<td class="c-lbl lval" ${sp>1?`rowspan="${sp}"`:''} data-g="${gi}" data-r="${ri}" data-li="${i-1}" style="left:${loff[i]}px">${ev.replace(/</g,'&lt;')}</td>`; }
      row.c.forEach((c,vi)=>{
        const pv=c?c[0]:null, sep=c?c[1]:null, ic=incl(c); const vcls=vi%2?" v1":"";
        h+=`<td class="pv vstart${vcls} ${pv==null?'dash':''}" data-g="${gi}" data-r="${ri}" data-v="${vi}" data-k="0">${pv==null?'-':fmt(pv)}</td>`;
        h+=`<td class="sep${vcls} ${multi&&sep!=null&&sep===mxS?'top-sep':''} ${sep==null?'dash':''}" data-g="${gi}" data-r="${ri}" data-v="${vi}" data-k="1">${sep==null?'-':fmt(sep)}</td>`;
        h+=`<td class="incl${vcls} ${multi&&ic!=null&&ic===mxI?'top-inc':''} ${ic==null?'dash':''}">${ic==null?'-':fmt(ic)}</td>`;
      });
      if(multi){ const wn=V.filter((_,i)=>incs[i]!=null&&incs[i]===mxI).map(x=>x.name);
        h+=`<td class="c-best">${wn.length?wn.map(n=>`<span class="best-chip">${n}</span>`).join(""):`<span class="best-chip">—</span>`}</td>`; }
      h+=`</tr>`;
    });
    }
  });
  h+=`</tbody></table>`;
  $("tblWrap").innerHTML=h;
  $("tbl").classList.toggle("editing-rows",state.rowEdit);
  $("tbl").classList.toggle("can-edit",state.dataEdit);
  wireTable();
}
function wireTable(){
  const t=tget();
  document.querySelectorAll("td.grpl").forEach(td=>td.onclick=e=>{ if(e.target.closest(".grp-edit"))return; const gi=+td.dataset.gi; const D=curView().data; D[gi].collapsed=!D[gi].collapsed; renderTable(); });
  if(!state.dataEdit) return;
  document.querySelectorAll(".rm-v").forEach(b=>b.onclick=e=>{ e.stopPropagation();
    if(t.vendors.length<=1){ openConfirm("삭제 불가","상부가 최소 1곳은 있어야 해요.",null,"확인만"); return; }
    const vi=+b.dataset.v;
    openConfirm("상부 삭제",`'${t.vendors[vi].name}' 상부를 이 통신사에서 삭제할까요?`,()=>{ t.vendors.splice(vi,1); t.data.forEach(g=>g.rows.forEach(r=>r.c.splice(vi,1))); buildNav(); renderMain(); });
  });
  document.querySelectorAll(".rm-l").forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const i=+b.dataset.i;
    openConfirm("구분 삭제",`'${t.labels[i]}' 구분 열을 삭제할까요?`,()=>{ t.labels.splice(i,1); t.data.forEach(g=>g.rows.forEach(r=>{ if(r.ext) r.ext.splice(i-1,1); })); renderMain(); });
  });
  document.querySelectorAll("td.lval").forEach(td=>td.onclick=()=>editLabelCell(td));
  document.querySelectorAll("th.lh").forEach(th=>th.onclick=e=>{ if(e.target.closest(".rm-l"))return; editLabelHeader(+th.dataset.li); });
  document.querySelectorAll(".grp-edit").forEach(b=>b.onclick=e=>{ e.stopPropagation(); editGroupName(+b.dataset.gi); });
  document.querySelectorAll("th.vh").forEach(th=>th.onclick=e=>{ if(e.target.closest(".rm-v"))return; editMemo(+th.dataset.v); });
  document.querySelectorAll("td.pv,td.sep").forEach(td=>td.onclick=()=>editCell(td));
  if(state.rowEdit){
    document.querySelectorAll("td.rn").forEach(td=>td.onclick=e=>{
      const b=e.target.closest("button[data-a]");
      if(b){ e.stopPropagation(); rowAct(b.dataset.a,+td.dataset.g,+td.dataset.r); return; }
      renameRow(td);
    });
  }
}
function editMemo(vi){
  const t=tget(), v=t.vendors[vi];
  openInput(`'${v.name}' 상부 메모`,[{k:"memo",label:"이 상부 위에 표시할 메모 (비우면 삭제)",type:"textarea",val:v.memo||""}],x=>{ v.memo=(x.memo||"").trim(); renderMain(); });
}
function rowAct(a,g,r){
  const t=tget();
  if(a==="del"){ t.data[g].rows.splice(r,1); if(!t.data[g].rows.length)t.data.splice(g,1); renderMain(); return; }
  const rows=t.data[g].rows;
  if(a==="up"){
    if(r>0){ [rows[r-1],rows[r]]=[rows[r],rows[r-1]]; }
    else if(g>0){ const row=rows.splice(r,1)[0]; t.data[g-1].rows.push(row); if(!rows.length)t.data.splice(g,1); }
    else return;
  } else {
    if(r<rows.length-1){ [rows[r+1],rows[r]]=[rows[r],rows[r+1]]; }
    else if(g<t.data.length-1){ const row=rows.splice(r,1)[0]; t.data[g+1].rows.unshift(row); if(!rows.length)t.data.splice(g,1); }
    else return;
  }
  renderMain();
}
function editCell(td){
  const t=tget(); const g=+td.dataset.g,r=+td.dataset.r,v=+td.dataset.v,k=+td.dataset.k;
  let cell=t.data[g].rows[r].c[v]; const cur=cell?cell[k]:null;
  td.classList.add("cell-editing"); td.innerHTML=`<input class="num" value="${cur==null?'':cur}">`;
  const inp=td.querySelector("input"); inp.focus(); inp.select();
  const done=()=>{ const num=parseN(inp.value);
    if(cell==null){ cell=[0,0]; t.data[g].rows[r].c[v]=cell; }
    cell[k]=num==null?0:num; renderTable(); };
  inp.onblur=done; inp.onkeydown=e=>{ if(e.key==="Enter"){inp.blur();} if(e.key==="Escape"){inp.onblur=null;renderTable();} };
}
function editGroupName(gi){
  const t=tget(); openInput("구분(그룹) 이름 변경",[{k:"g",label:"이름",val:t.data[gi].g}],v=>{ if(v.g.trim()){ t.data[gi].g=v.g.trim(); renderTable(); } });

function wireAddBar(){
  const t=tget();
  $("addVendBtn").onclick=()=>{ const nm=$("newVend").value.trim(); if(!nm)return;
    t.vendors.push({name:nm,memo:""}); t.data.forEach(g=>g.rows.forEach(r=>r.c.push([0,0]))); buildNav(); renderMain(); };
  $("newVend").onkeydown=e=>{ if(e.key==="Enter") $("addVendBtn").click(); };
  $("rowEditBtn").onclick=()=>{ state.rowEdit=!state.rowEdit; renderMain(); };
  if($("addLabelBtn")) $("addLabelBtn").onclick=()=>{
    openInput("구분(상품 설명) 열 추가",[{k:"name",label:"구분 이름 (예: 구분, 선납권)",val:"",ph:"예: 선납권"}],v=>{ const nm=(v.name||"").trim(); if(!nm)return;
      t.labels.push(nm); t.data.forEach(g=>g.rows.forEach(r=>{ r.ext=r.ext||[]; r.ext.push(""); })); renderMain(); });
  };
  if($("addRowBtn")) $("addRowBtn").onclick=()=>{
    const opts=t.data.map((g,i)=>[String(i),g.g]); opts.push(["__new","+ 새 구분(그룹) 만들기"]);
    openInput("행(상품) 추가",[
      {k:"grp",label:"어느 구분에 추가할까요?",type:"select",options:opts},
      {k:"name",label:"상품명",val:"새 상품"},
      {k:"newg",label:"새 구분 이름 ('새 구분' 선택 시)",val:""},
    ],v=>{
      let gi;
      if(v.grp==="__new"){ t.data.push({g:(v.newg||"").trim()||"새 구분",rows:[]}); gi=t.data.length-1; }
      else gi=+v.grp;
      t.data[gi].rows.push({n:(v.name||"새 상품").trim(),ext:t.labels.slice(1).map(()=>""),c:t.vendors.map(()=>[0,0])});
      renderMain();
    });
  };
}

function imageView(t){
  const rows=(t.seg||[]).map(s=>`<tr><td>${s[0]}</td><td class="num">${fmt(s[1])}</td><td class="num">${fmt(s[2])}</td></tr>`).join("");
  return `<div class="card"><div class="imgwrap">
    <div>
      <div style="font-weight:700;margin-bottom:10px">구간별 단가 (${state.month} · 무선)</div>
      <table class="seg-tbl"><thead><tr><th>구간</th><th>단판</th><th>동판</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="imgbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>

    </div></div>
    <div class="mini-note">이 통신사는 상부가 1곳이고 정책이 이미지로 와요. 핵심 구간 단가만 숫자로 옮겨 적고, 원문 이미지는 그대로 첨부해 둡니다. 실제 연동 시 담당자가 올린 원문이 오른쪽에 뜹니다.</div>
  </div>`;
}

function toast(msg){ let el=$("toast"); if(!el){ el=document.createElement("div"); el.id="toast";
    el.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:500;opacity:0;transition:.2s;box-shadow:0 6px 20px rgba(0,0,0,.2)";
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity="1"; clearTimeout(window._t); window._t=setTimeout(()=>el.style.opacity="0",1800); }

let _inputOk=null;
function openInput(title,fields,cb){
  $("imTitle").textContent=title;
  $("imBody").innerHTML=fields.map(f=>{
    if(f.type==="select") return `<div class="fg"><label class="fl">${f.label}</label><select data-k="${f.k}">${f.options.map(o=>`<option value="${o[0]}" ${f.val===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`;
    if(f.type==="textarea") return `<div class="fg"><label class="fl">${f.label}</label><textarea data-k="${f.k}" placeholder="${f.ph||''}">${(f.val||"").replace(/</g,'&lt;')}</textarea></div>`;
    const tp=f.type==="password"?"password":"text";
    return `<div class="fg"><label class="fl">${f.label}</label><input type="${tp}" data-k="${f.k}" value="${(f.val||"").replace(/"/g,'&quot;')}" placeholder="${f.ph||""}"></div>`;
  }).join("");
  _inputOk=()=>{ const vals={}; $("imBody").querySelectorAll("[data-k]").forEach(el=>vals[el.dataset.k]=el.value); const keep=cb(vals); if(keep!==false) $("inputModal").classList.remove("open"); };
  $("inputModal").classList.add("open");
  const first=$("imBody").querySelector("input,select"); if(first){first.focus(); if(first.select)first.select();}
}
$("imOk").onclick=()=>_inputOk&&_inputOk();
$("imBody").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.tagName==="INPUT")_inputOk&&_inputOk(); });

let _cfOk=null;
function openConfirm(title,body,cb,mode){
  $("cfTitle").textContent=title; $("cfBody").textContent=body;
  const ok=$("cfOk"); if(mode==="확인만"){ ok.textContent="확인"; ok.className="btn btn-p"; } else { ok.textContent="삭제"; ok.className="btn btn-d"; }
  _cfOk=()=>{ $("confirmModal").classList.remove("open"); cb&&cb(); };
  $("confirmModal").classList.add("open");
}
$("cfOk").onclick=()=>_cfOk&&_cfOk();

function renderAllow(){
  $("allowList").innerHTML=ALLOW.map((a,i)=>`<div class="allow-row"><span class="em">${a.em}<br><input class="nm" data-i="${i}" value="${(a.name||'').replace(/"/g,'&quot;')}" placeholder="이름"></span><button class="rl rl-tog" data-i="${i}" title="클릭해서 권한 변경">${a.role}</button><button class="del" data-i="${i}">삭제</button></div>`).join("");
  $("allowList").querySelectorAll(".del").forEach(b=>b.onclick=()=>{ const rm=ALLOW.splice(+b.dataset.i,1)[0]; if(CONNECTED&&rm&&rm.em){ try{ google.script.run.unshareWith(rm.em); }catch(e){} } renderAllow(); cloudSave(); });
  $("allowList").querySelectorAll(".nm").forEach(inp=>inp.onchange=()=>{ ALLOW[+inp.dataset.i].name=inp.value.trim()||"신규"; cloudSave(); });
  $("allowList").querySelectorAll(".rl-tog").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i,a=ALLOW[i]; a.role=(a.role==="관리자")?"담당자":"관리자"; if(CONNECTED&&a.em){ try{ google.script.run.shareWith(a.em,a.role); }catch(e){} } renderAllow(); cloudSave(); });
}

/* ==================== 구글 시트 연동 ==================== */
const CONNECTED=(typeof google!=="undefined"&&google.script&&google.script.run);
function _serialize(){ const cs=CARRIERS.map(c=>Object.assign({},c,{logo:undefined})); return JSON.stringify({v:1,CARRIERS:cs,ALLOW:ALLOW}); }
function cloudSave(){ if(!CONNECTED)return; try{ google.script.run.withSuccessHandler(function(){toast("시트에 저장됨 ✓");}).withFailureHandler(function(){toast("저장 실패 — 다시 시도");}).saveData(_serialize()); }catch(e){ toast("저장 오류"); } }
function applyCloudData(v){ if(!v)return; try{ const o=JSON.parse(v);
  if(o&&o.CARRIERS&&o.CARRIERS.length){ CARRIERS.length=0; o.CARRIERS.forEach(function(c){CARRIERS.push(c);}); CARRIERS.forEach(function(c){ if(c.logoKey&&LOGOS[c.logoKey]) c.logo=LOGOS[c.logoKey]; }); }
  if(o&&o.ALLOW&&o.ALLOW.length){ ALLOW.length=0; o.ALLOW.forEach(function(a){ALLOW.push(a);}); }
}catch(e){} }
function _blocked(email){ const c=document.querySelector(".login-card"); if(!c)return;
  c.innerHTML='<img class="logo-img" alt="" style="width:54px;height:54px;margin:0 auto 14px;display:block;border-radius:11px;object-fit:contain">'
    +'<h1>접근 권한 없음</h1>'
    +'<p style="color:#c0392b;font-weight:700;margin:4px 0 2px">'+((email||'(계정 정보 없음)').replace(/</g,'&lt;'))+'</p>'
    +'<p>이 계정은 허용 명단에 없어 접속할 수 없습니다.<br>관리자에게 명단 등록을 요청하세요.</p>'
    +'<div class="login-note" style="margin-top:16px"><a href="#" onclick="location.reload();return false" style="color:#4285F4;font-weight:600">다른 구글 계정으로 로그인</a></div>';
  const im=c.querySelector(".logo-img"); if(im&&typeof LOGO!=="undefined") im.src=LOGO;
}
function _loginAs(entry){ const isAdmin=(entry.role==="관리자");
  state.user={name:entry.name,role:entry.role,av:(entry.name||"?").slice(0,1),isAdmin:isAdmin,email:entry.em};
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("uAv").textContent=state.user.av; $("uName").textContent=state.user.name; $("uRole").textContent=state.user.role;
  $("adminBtn").style.display=isAdmin?"":"none";
  $("menuEditLink").style.display=isAdmin?"":"none";
  $("addTelBtn").style.display=isAdmin?"":"none";
  buildNav(); selectTel(firstSubId());
  if(isAdmin) _syncShare();
}
function _authByEmail(email){ const e=(email||"").toLowerCase().trim();
  const hit=ALLOW.find(function(a){return (a.em||"").toLowerCase()===e;});
  if(!e){ _blocked("(구글 계정 정보를 불러올 수 없어요)"); return; }
  if(!hit){ _blocked(email); return; }
  _loginAs(hit);
}
function _syncShare(){ if(!CONNECTED)return; ALLOW.forEach(function(a){ try{ google.script.run.shareWith(a.em,a.role); }catch(e){} }); }
function bootConnected(){
  const p=document.querySelector(".login-card p"); if(p) p.textContent="구글 계정 확인 중…";
  const btn=$("googleBtn"), who=document.querySelector(".who"); if(btn) btn.style.display="none"; if(who) who.style.display="none";
  google.script.run.withSuccessHandler(function(email){
    google.script.run.withSuccessHandler(function(v){ applyCloudData(v); _authByEmail(email); })
      .withFailureHandler(function(){ _authByEmail(email); }).getData();
  }).withFailureHandler(function(){ _authByEmail(""); }).getUserEmail();
}
if(CONNECTED){ bootConnected(); }
